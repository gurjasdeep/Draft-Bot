<svg xmlns="http://www.w3.org/2000/svg"
     width="400"
     height="300"
     viewBox="0 0 400 300">

    <!-- Square -->
    <path d="M 50 50
             L 150 50
             L 150 150
             L 50 150
             Z"
          fill="none"
          stroke="black"
          stroke-width="2"/>

    <!-- Triangle -->
    <path d="M 200 150
             L 250 50
             L 300 150
             Z"
          fill="none"
          stroke="black"
          stroke-width="2"/>

    <!-- Line -->
    <path d="M 50 220
             L 300 220"
          fill="none"
          stroke="black"
          stroke-width="2"/>

</svg>
